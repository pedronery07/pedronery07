name: generate pacman contribution graph

on:
  schedule:
    - cron: "0 0 * * *" # roda 1x por dia
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: pedronery07
          # jogos disponíveis: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "pacman"

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
