name: generate contribution graphs (snake + pacman)

on:
  schedule:
    - cron: "0 0 * * *" # roda 1x por dia
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: generate snake graph
        uses: Platane/snk@v3
        id: snake-graph
        with:
          github_user_name: pedronery07
          outputs: |
            dist/snake-contribution-graph.svg
            dist/snake-contribution-graph-dark.svg?palette=github-dark

      # Platane/snk roda em container Docker e deixa dist/ com dono root,
      # o que impede a action seguinte (que roda como usuário comum) de
      # escrever ali — corrigimos a permissão antes do próximo passo
      - name: fix dist/ ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: generate pacman graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: pedronery07
          # jogos disponíveis: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "pacman"

      # ambas as actions acima escrevem em ./dist — um único push evita que
      # os workflows se sobrescrevam ao publicar no branch `output`
      - name: push graphs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
